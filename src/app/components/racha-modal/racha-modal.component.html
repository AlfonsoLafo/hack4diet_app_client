<ion-content class="ion-padding ion-text-center modal-bg">
  <div class="modal-wrapper">
    
    <div class="icon-container">
      <ion-icon name="flame" class="fire-icon heartbeat"></ion-icon>
    </div>

    <h1 class="title">¡Día {{ rachaActual }}!</h1>
    <p class="subtitle">{{ mensajePersonalizado }}</p>

    <h2 class="points-earned">+{{ puntosGanados }} puntos</h2>

    <div class="timeline-container">
      <div class="day-card" 
           *ngFor="let recompensa of diasRecompensa"
           [ngClass]="{
             'active': getDiaDestacado() === recompensa.dia, 
             'past': getDiaDestacado() > recompensa.dia
           }">
        
        <div class="day-title">Día {{ recompensa.dia }}{{ recompensa.dia === 7 ? '+' : '' }}</div>
        <div class="points-value">+{{ recompensa.puntos }}</div>
        <div class="points-text">puntos</div>
        
        <ion-icon name="checkmark-circle" class="check-icon" *ngIf="getDiaDestacado() > recompensa.dia"></ion-icon>
      </div>
    </div>

    <ion-button expand="block" shape="round" color="primary" class="ion-margin-top" (click)="cerrar()">
      Continuar
    </ion-button>

  </div>
</ion-content>
