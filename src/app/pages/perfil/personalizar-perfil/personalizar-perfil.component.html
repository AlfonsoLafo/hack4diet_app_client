<div class="ion-padding custom-page">

  <!-- ================= AVATARES ================= -->
  <div class="section-title">
    <h4>Tu Avatar</h4>
  </div>
  
  <div class="avatar-scroll-container">
    <div class="avatar-box" *ngFor="let avatar of avatares" (click)="seleccionarAvatar(avatar)">
      <!-- Placeholder de avatar -->
    </div>
  </div>
  
  <div class="section-title margin-top">
    <h4>Colección de Insignias ({{ idsDesbloqueadas.length }}/{{ insigniasBD.length }})</h4>
  </div>

  <div class="featured-badges-grid">
    <div class="featured-slot" *ngFor="let insignia of misInsigniasDestacadas">
      <app-insignia [insignia]="insignia" (click)="insignia && gestionarInsignia(insignia)"></app-insignia>
    </div>
  </div>

  <!-- ================= TODAS LAS INSIGNIAS (Catálogo) ================= -->
  <div class="section-title margin-top">
    <h4>Colección de Insignias ({{ idsDesbloqueadas.length }}/{{ insigniasBD.length }})</h4>
  </div>

  <div class="all-badges-list">
    <div class="badge-row" 
         *ngFor="let insignia of insigniasBD" 
         [class.locked-row]="!esDesbloqueada(insignia)"
         (click)="gestionarInsignia(insignia)">
      
      <app-insignia [insignia]="insignia" [bloqueada]="!esDesbloqueada(insignia)"></app-insignia>

      <div class="badge-info">
        <h5 class="badge-name">{{ insignia.nombre }}</h5>
        <p class="badge-objective">{{ insignia.objetivo }}</p>
      </div>
    </div>
  </div>

</div>
